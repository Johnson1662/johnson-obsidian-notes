<text x='64' y='112' font-size='15' font-weight='700' fill='#0f172a'>标称 Nominal</text>
<text x='64' y='132' font-size='12' fill='#475569'>发色、职业、邮编、学号</text>
<rect x='362' y='104' width='68' height='26' rx='6' fill='#e2e8f0'/>
