<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' font-family='Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif'>
<rect x='0' y='0' width='760' height='400' rx='14' fill='#ffffff'/>
<text x='40' y='42' font-size='19' font-weight='700' fill='#0f172a'>属性尺度：四级阶梯</text>
<text x='40' y='66' font-size='13' fill='#64748b'>每升一级，多一种允许的运算</text>
