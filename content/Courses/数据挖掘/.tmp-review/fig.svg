<rect x='46' y='224' width='5' height='58' rx='2' fill='#10b981'/>
<text x='64' y='248' font-size='15' font-weight='700' fill='#0f172a'>区间 Interval</text>
<text x='64' y='268' font-size='12' fill='#475569'>摄氏温度、日历日期</text>
<rect x='502' y='240' width='68' height='26' rx='6' fill='#d1fae5'/>
