<rect x='46' y='156' width='5' height='58' rx='2' fill='#94a3b8'/>
<text x='64' y='180' font-size='15' font-weight='700' fill='#0f172a'>序数 Ordinal</text>
<text x='64' y='200' font-size='12' fill='#475569'>疼痛等级、满意度、比赛名次</text>
