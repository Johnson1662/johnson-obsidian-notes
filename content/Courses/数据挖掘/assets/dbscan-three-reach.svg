<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="600" viewBox="0 0 1020 600" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif">
<rect width="1020" height="600" fill="#ffffff"/>
<defs><marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e9e4f"/></marker></defs>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker></defs>
<defs><marker id="ap" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b3fd0"/></marker></defs>
<text x="190" y="40" text-anchor="middle" font-size="17" font-weight="bold">① 直接密度可达</text>
<circle cx="150" cy="235" r="85" fill="#4a90d9" fill-opacity="0.07" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="150" cy="235" r="8" fill="#1f2d3d" stroke="#fff" stroke-width="1"/>
<circle cx="210" cy="165" r="5" fill="#6b7a8f" stroke="#fff" stroke-width="1"/>
<line x1="159" y1="226" x2="203" y2="172" stroke="#2e9e4f" stroke-width="2" marker-end="url(#ag)"/>
<text x="110" y="269" font-size="15" fill="#111" text-anchor="start">q（核心）</text>
<text x="222" y="169" font-size="16" fill="#111" text-anchor="start">p</text>
<text x="120" y="430" font-size="14" fill="#333" text-anchor="start">p 落在核心点 q 的 ε 圆内 →</text>
<text x="120" y="452" font-size="14" fill="#333" text-anchor="start">一步可达；</text>
<text x="196" y="452" font-size="14" fill="#c0392b" text-anchor="start">p 不必是核心</text>
<text x="520" y="40" text-anchor="middle" font-size="17" font-weight="bold">② 密度可达（链式）</text>
<circle cx="400" cy="255" r="70" fill="#4a90d9" fill-opacity="0.07" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="470" cy="225" r="70" fill="#4a90d9" fill-opacity="0.07" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="400" cy="255" r="8" fill="#1f2d3d" stroke="#fff" stroke-width="1"/>
<circle cx="470" cy="225" r="8" fill="#1f2d3d" stroke="#fff" stroke-width="1"/>
<circle cx="530" cy="195" r="5" fill="#6b7a8f" stroke="#fff" stroke-width="1"/>
<line x1="409" y1="249" x2="461" y2="227" stroke="#2e9e4f" stroke-width="2" marker-end="url(#ag)"/>
<line x1="479" y1="221" x2="523" y2="198" stroke="#2e9e4f" stroke-width="2" marker-end="url(#ag)"/>
<path d="M 394 247 Q 455 110 524 187" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="455" y="100" font-size="13" fill="#c0392b" text-anchor="middle">密度可达（经 q₂）</text>
<text x="354" y="261" font-size="16" fill="#111" text-anchor="start">q₁</text>
<text x="354" y="281" font-size="11" fill="#555" text-anchor="start">核心</text>
<text x="482" y="231" font-size="16" fill="#111" text-anchor="start">q₂</text>
<text x="482" y="251" font-size="11" fill="#555" text-anchor="start">核心</text>
<text x="542" y="199" font-size="16" fill="#111" text-anchor="start">p</text>
<text x="380" y="430" font-size="14" fill="#333" text-anchor="start">q₁→q₂→p 一串直接可达接起来 →</text>
<text x="380" y="452" font-size="14" fill="#333" text-anchor="start">q₁ 到 p 密度可达；</text>
<text x="520" y="452" font-size="14" fill="#c0392b" text-anchor="start">反向通常不成立（p 非核心）</text>
<text x="850" y="40" text-anchor="middle" font-size="17" font-weight="bold">③ 密度相连</text>
<circle cx="840" cy="240" r="80" fill="#4a90d9" fill-opacity="0.07" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="840" cy="240" r="8" fill="#1f2d3d" stroke="#fff" stroke-width="1"/>
<circle cx="775" cy="170" r="5" fill="#6b7a8f" stroke="#fff" stroke-width="1"/>
<circle cx="905" cy="170" r="5" fill="#6b7a8f" stroke="#fff" stroke-width="1"/>
<line x1="833" y1="234" x2="779" y2="175" stroke="#6b3fd0" stroke-width="2" marker-end="url(#ap)"/>
<line x1="847" y1="234" x2="901" y2="175" stroke="#6b3fd0" stroke-width="2" marker-end="url(#ap)"/>
<text x="834" y="270" font-size="16" fill="#111" text-anchor="middle">o</text>
<text x="834" y="288" font-size="11" fill="#555" text-anchor="middle">共同源头</text>
<text x="771" y="158" font-size="16" fill="#111" text-anchor="middle">p</text>
<text x="909" y="158" font-size="16" fill="#111" text-anchor="middle">s</text>
<text x="720" y="430" font-size="14" fill="#333" text-anchor="start">存在共同的 o，使 p、s 都从 o 密度可达 →</text>
<text x="720" y="452" font-size="14" fill="#333" text-anchor="start">p、s 密度相连。</text>
<text x="820" y="452" font-size="14" fill="#2e6fbf" text-anchor="start">对称、可传递 → 同一簇</text>
<text x="60" y="510" font-size="15" fill="#111" text-anchor="start">图例：</text>
<circle cx="150" cy="505" r="8" fill="#1f2d3d"/>
<text x="165" y="510" font-size="13" fill="#333" text-anchor="start">核心对象</text>
<circle cx="270" cy="505" r="5" fill="#6b7a8f"/>
<text x="282" y="510" font-size="13" fill="#333" text-anchor="start">非核心点</text>
<circle cx="390" cy="505" r="12" fill="none" stroke="#4a90d9" stroke-dasharray="6 4"/>
<text x="408" y="510" font-size="13" fill="#333" text-anchor="start">ε-邻域（半径 ε）</text>
<line x1="560" y1="505" x2="600" y2="505" stroke="#2e9e4f" stroke-width="2" marker-end="url(#ag)"/>
<text x="608" y="510" font-size="13" fill="#333" text-anchor="start">直接可达</text>
<line x1="710" y1="505" x2="750" y2="505" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="758" y="510" font-size="13" fill="#333" text-anchor="start">密度可达（链）</text>
<line x1="880" y1="505" x2="920" y2="505" stroke="#6b3fd0" stroke-width="2" marker-end="url(#ap)"/>
<text x="928" y="510" font-size="13" fill="#333" text-anchor="start">共同源头</text>
</svg>